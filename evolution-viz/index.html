<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Evolution Chain Visualization</title>
    <link rel="stylesheet" href="css/evolution-styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>🔗 Community Evolution Chain Visualization</h1>
            <p class="subtitle">Interactive temporal tracking of workforce communities</p>
        </header>

        <!-- Upload Section -->
        <div id="uploadSection" class="upload-section">
            <div class="upload-card">
                <div class="upload-icon">📊</div>
                <h3>Upload Chain Data</h3>
                <p>Upload the weighted_chain_details JSON file</p>
                <input type="file" id="chainFileInput" accept=".json" style="display: none;">
                <button class="upload-btn" onclick="document.getElementById('chainFileInput').click()">
                    Choose File
                </button>
                <div id="uploadStatus" class="upload-status"></div>
            </div>
        </div>

        <!-- Main Visualization Area (Hidden Initially) -->
        <div id="mainViz" class="main-viz" style="display: none;">
            
            <!-- Control Panel -->
            <div class="control-panel">
                <div class="control-group">
                    <label>Filter by Length:</label>
                    <select id="lengthFilter">
                        <option value="all">All Chains</option>
                        <option value="singleton">Singleton (1 year)</option>
                        <option value="short">Short (2-4 years)</option>
                        <option value="medium">Medium (5-9 years)</option>
                        <option value="long">Long (10-19 years)</option>
                        <option value="verylong">Very Long (20+ years)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Sort Chains By:</label>
                    <select id="sortBy">
                        <option value="length">Length (Longest First)</option>
                        <option value="score">Similarity Score</option>
                        <option value="start_year">Start Year</option>
                        <option value="size">Community Size</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Layout Mode:</label>
                    <select id="layoutMode">
                        <option value="timeline">Timeline Layout</option>
                        <option value="vertical">Vertical Lanes</option>
                        <option value="force">Force-Directed</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Max Chains to Display:</label>
                    <input type="number" id="maxChains" value="50" min="10" max="500" step="10">
                </div>

                <div class="control-actions">
                    <button class="action-btn" onclick="EvolutionApp.applyFilters()">
                        Apply Filters
                    </button>
                    <button class="action-btn secondary" onclick="EvolutionApp.resetFilters()">
                        Reset
                    </button>
                    <button class="action-btn" onclick="EvolutionApp.fitToView()">
                        🎯 Fit to View
                    </button>
                </div>
            </div>

            <!-- Statistics Panel -->
            <div class="stats-panel">
                <h3>📈 Chain Statistics</h3>
                <div id="statsContent" class="stats-content"></div>
            </div>

            <!-- Visualization Canvas -->
            <div class="viz-canvas">
                <svg id="evolutionSvg" width="100%" height="100%"></svg>
                
                <!-- Zoom Controls -->
                <div class="zoom-controls">
                    <button onclick="EvolutionApp.zoomIn()" title="Zoom In">+</button>
                    <button onclick="EvolutionApp.zoomOut()" title="Zoom Out">−</button>
                    <button onclick="EvolutionApp.resetZoom()" title="Reset Zoom">⊙</button>
                </div>

                <!-- Year Axis -->
                <div id="yearAxis" class="year-axis"></div>
            </div>

            <!-- Chain List Sidebar -->
            <div class="chain-list-sidebar" id="chainListSidebar">
                <div class="sidebar-header">
                    <h3>Evolution Chains</h3>
                    <button class="close-btn" onclick="EvolutionApp.toggleSidebar()">×</button>
                </div>
                <div class="sidebar-content" id="chainListContent"></div>
            </div>

            <!-- Toggle Sidebar Button -->
            <button class="toggle-sidebar-btn" onclick="EvolutionApp.toggleSidebar()">
                📋
            </button>
        </div>

        <!-- Community Detail Panel (Modal) -->
        <div id="communityPanel" class="community-panel">
            <div class="panel-overlay" onclick="EvolutionApp.closeDetailPanel()"></div>
            <div class="panel-content">
                <div class="panel-header">
                    <h3 id="panelTitle">Community Details</h3>
                    <button class="close-btn" onclick="EvolutionApp.closeDetailPanel()">×</button>
                </div>
                <div class="panel-body" id="panelBody"></div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/evolution-config.js"></script>
    <script src="js/evolution-data-loader.js"></script>
    <script src="js/evolution-visualizer.js"></script>
    <script src="js/evolution-detail-panel.js"></script>
    <script src="js/evolution-app.js"></script>
</body>
</html>
